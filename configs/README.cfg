# ═══════════════════════════════════════
#  Resume Generator — Reference
# ═══════════════════════════════════════
#
# SYNTAX:
#   key=value           (single value)
#   key=[a, b, c]       (list)
#   # comment           (ignored)
#
# ── KEYS ─────────────────────────────
#
# industry=[...]
#   quant, systems, ai_ml,
#   software_engineering,
#   formal_methods
#
# projects=[...]
#   malloc, audio_relay, squishy,
#   lean4game, sigecom, fin_eng
#   Explicit projects are added in the
#   order listed.
#
# ORDERING:
#   If projects comes before industry,
#   those projects appear first.
#   If industry comes first, industry
#   picks fill first, then projects.
#   Duplicates are automatically removed.
#
# include_projects=true|false
# min_bullets=N
# max_bullets=N
# title=My Resume Title
#   PDF document metadata title (browser tab /
#   PDF reader title bar). Defaults to
#   {name} - {filename} when omitted.
# 
